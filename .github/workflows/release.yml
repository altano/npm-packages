name: release

on:
  workflow_run:
    workflows: [test]
    branches: [main]
    types:
      - completed

concurrency: ${{ github.workflow }}-${{ github.ref }}

# Default the GITHUB_TOKEN to read-only. The release job below opts into the
# broader scopes it needs (job-level permissions replace this, not merge with
# it).
permissions:
  contents: read

# Use Turborepo remote caching w/ custom cache server
env:
  TURBO_API: ${{ vars.TURBO_API }}
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  on-failure:
    name: Handle Test Run Failure
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    steps:
      - run: echo 'The test workflow failed, not releasing'

  release-on-success:
    name: Release
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare
        uses: ./.github/actions/install-nix
        with:
          devshell: ci
      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          # `changeset version` formats what it writes by running `pnpm exec
          # prettier`, and pnpm is only on PATH inside the devshell.
          # `nix develop` keeps the caller's environment, so the
          # `CHANGESETS_OUTPUT` variable the action sets reaches the
          # Changesets CLI, which v2 needs to report what was published.
          version-script: nix develop .#ci --command pnpm version-packages
          publish-script: nix develop .#ci --command pnpm release
        env:
          NPM_CONFIG_PROVENANCE: true
