name: test

# As recommended by Graphite
# (https://graphite.dev/docs/github-configuration-guidelines#github-actions)
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

# Cancel in-progress jobs for the same work
# (https://graphite.dev/docs/troubleshooting#why-are-my-actions-running-twice)
concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || ''}}
  cancel-in-progress: true

# Use turborepo remote caching w/ custom cache server
env:
  TURBO_API: ${{ vars.TURBO_API }}
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  # Build the dev image from this commit's flake.nix and push to GHCR. The
  # image is tagged by a content hash (nix2container's imageTag) so identical
  # contents short-circuit; only commits that actually change the image rebuild
  # it. Logic lives in a reusable composite action so release.yml can do the
  # same lookup independently.
  build-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.build.outputs.image }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Build dev image
        id: build
        uses: ./.github/actions/build-dev-image
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: build-image
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.build-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm turbo run build --summarize
      - name: Summarize Turbo
        uses: ./.github/actions/turbo-summarize

  lint:
    needs: [build-image, build]
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.build-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm turbo run lint --summarize
      - name: Summarize Turbo
        uses: ./.github/actions/turbo-summarize

  format:
    needs: [build-image, build]
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.build-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Format
        run: pnpm turbo run format --summarize
      - name: Summarize Turbo
        uses: ./.github/actions/turbo-summarize

  check:
    needs: [build-image, build]
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.build-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Check
        run: pnpm turbo run check --summarize
      - name: Summarize Turbo
        uses: ./.github/actions/turbo-summarize

  test-unit:
    needs: [build-image, build]
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.build-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Run tests
        run: pnpm turbo run test:unit --summarize
      - name: Summarize Turbo
        uses: ./.github/actions/turbo-summarize

  test-e2e:
    needs: [build-image, build]
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.build-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Debug Playwright browsers
        run: |
          echo "PLAYWRIGHT_BROWSERS_PATH=$PLAYWRIGHT_BROWSERS_PATH"
          ls -la "$PLAYWRIGHT_BROWSERS_PATH"/
          echo "--- webkit contents ---"
          ls -la "$PLAYWRIGHT_BROWSERS_PATH"/webkit-*/
          echo "--- testing webkit binary ---"
          ldd "$PLAYWRIGHT_BROWSERS_PATH"/webkit-*/minibrowser-wpe/MiniBrowser 2>&1 | grep "not found" || echo "all libs found"
      - name: Run tests
        run: pnpm turbo run test:e2e --summarize
        # env:
        #   DEBUG: "pw:browser*"
      - name: Summarize Turbo
        uses: ./.github/actions/turbo-summarize
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: "**/playwright-report/"
          retention-days: 30

  # When this completes, all validation is successful. This job only exists so
  # that we have *one* job we can make required in the repository settings. The
  # alternative is to define all the required jobs (e.g. test-e2e, test-unit,
  # lint, etc) separately in the repository settings, and manually keep that
  # setting in sync with this file. Defining the list here in code is better.
  test:
    needs: [build, lint, format, check, test-unit, test-e2e]
    runs-on: ubuntu-latest
    steps:
      - run: echo "Done."
