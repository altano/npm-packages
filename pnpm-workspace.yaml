# Specifies the number of minutes that must pass after a version is published
# before pnpm will install it. For example, setting minimumReleaseAge: 1440
# ensures that only packages released at least one day ago can be installed.
#
# https://github.com/pnpm/pnpm/releases/tag/v10.16.0
minimumReleaseAge: 10080

# Never silently auto-approve an immature version. pnpm already infers this
# because `minimumReleaseAge` is set explicitly above, but without it the
# default is "loose": pnpm appends whatever it picked to
# `minimumReleaseAgeExclude` and carries on, which quietly defeats the quarantine.
# Strict mode prompts instead, and declining aborts before anything is written.
#
# https://pnpm.io/settings#minimumreleaseagestrict
minimumReleaseAgeStrict: true

# doesn't catch my invalid deps right now but hopefully that'll be fixed in the
# future.
# https://github.com/pnpm/pnpm/issues/10824
strictPeerDependencies: true

# pnpm 11 defaults `strictDepBuilds` to true, so every dependency with a build
# script has to be explicitly reviewed or the install fails.
#
# All of these ship their native binaries as prebuilt, platform-specific
# optionalDependencies (@esbuild/*, @img/sharp-*, @unrs/resolver-binding-*),
# which pnpm installs directly. Their install scripts are only the
# compile-from-source fallback, so there's nothing to gain by running them.
# These builds were already being skipped under pnpm 10; this just records that.
#
# https://pnpm.io/settings#allowbuilds
allowBuilds:
  esbuild: false
  sharp: false
  unrs-resolver: false

supportedArchitectures:
  cpu:
    - current
    - x64
  os:
    - current
    - linux
